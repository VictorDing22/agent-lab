[project]
name = "agent-lab"
version = "0.1.0"
description = "迷你采购智能体练手营：从采购助手到三大采购场景（西高院项目微缩版）"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",           # 通用 LLM 客户端，连 Ollama / MaaS 网关的 OpenAI 兼容接口
    "numpy>=1.26",           # 第6关：向量相似度计算
    "pyyaml>=6.0",           # 第4/6关：解析 SKILL.md 和制度 frontmatter
    "mcp>=1.0",              # 第7关：MCP 官方 SDK（征信 server + client）
]
